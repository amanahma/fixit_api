name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fixit
          POSTGRES_PASSWORD: fixit
          POSTGRES_DB: fixit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixit -d fixit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://fixit:fixit@localhost:5432/fixit_test
      TEST_DATABASE_URL: postgresql+asyncpg://fixit:fixit@localhost:5432/fixit_test
      SERVICE_DISTRICTS: New Delhi,Central Delhi,South Delhi,North Delhi,East Delhi,West Delhi
      PINCODE_API_BASE_URL: https://api.postalpincode.in
      HTTP_TIMEOUT_SECONDS: "5"
      LOG_LEVEL: WARNING
      ENABLE_ERROR_PROBE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest
